plugins {
    id 'com.android.application'
}

def configuredApiBaseUrl = project.findProperty('API_BASE_URL') ?: 'http://10.0.2.2:8080/api'

android {
    buildFeatures {
        buildConfig true
    }

    namespace 'com.nextgen.mparivahan'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nextgen.mparivahan'
        minSdk 23
        targetSdk 34
        versionCode 7
        versionName '1.7-staging'
        buildConfigField 'String', 'API_BASE_URL', '"' + configuredApiBaseUrl + '"'
    }

    buildTypes {
        debug {
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
            manifestPlaceholders = [usesCleartextTraffic: "false"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
