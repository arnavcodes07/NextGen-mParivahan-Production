# Staging profile: isolated local file database and configurable port.
server.port=${SERVER_PORT:8080}
spring.application.name=nextgen-mparivahan-api-staging
spring.datasource.url=jdbc:h2:file:./data/mparivahan-staging;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${STAGING_DB_PASSWORD:}
spring.sql.init.mode=always
spring.jpa.open-in-view=false
server.error.include-message=always
